spring.application.name=covid19-tracker

# Honour a PORT variable (Heroku, Cloud Run, Render, ...) and fall back to 8081.
server.port=${PORT:8081}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml

# Fingerprint static assets so they can be cached aggressively.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d

# --- Tracker -----------------------------------------------------------------
# Source CSV, in the JHU CSSE "time_series_covid19_*_global" format.
tracker.data-url=https://raw.githubusercontent.com/CSSEGISandData/COVID-19/master/csse_covid_19_data/csse_covid_19_time_series/time_series_covid19_confirmed_global.csv
# Spring cron expression (second minute hour day month weekday); "-" disables scheduled refreshes.
tracker.refresh-cron=0 0 10 * * *
# While no data has been loaded, retry this often.
tracker.retry-interval=5m
tracker.load-on-startup=true
tracker.connect-timeout=10s
tracker.read-timeout=60s
# Show a "data is out of date" notice once the latest report is older than this.
tracker.stale-after=7d
