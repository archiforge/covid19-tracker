<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--/* Shared <head> content. Usage: <th:block th:replace="~{fragments/layout :: assets}" /> */-->
    <th:block th:fragment="assets">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="description"
              content="Cumulative confirmed COVID-19 cases by country, from the Johns Hopkins University CSSE data set.">
        <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
        <script>
            // Apply the saved theme before first paint to avoid a flash of the wrong one.
            (function () {
                var root = document.documentElement;
                root.classList.add('js');
                try {
                    var theme = localStorage.getItem('theme');
                    if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
                } catch (e) { /* storage unavailable: follow the system setting */ }
            })();
        </script>
        <script th:src="@{/js/app.js}" defer></script>
    </th:block>
</head>
<body>

<header class="site-header" th:fragment="header">
    <div class="container site-header__inner">
        <a class="brand" th:href="@{/}" aria-label="COVID-19 Tracker home">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="8" fill="currentColor"/>
                <polyline points="5,17 11,17 14,9 18,24 21,14 23,17 27,17" fill="none" stroke="#fff"
                          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="brand__name">COVID-19 Tracker</span>
        </a>
        <nav class="site-header__actions" aria-label="Site">
            <a class="header-link" th:href="@{/api/summary}">API</a>
            <a class="header-link header-link--secondary" href="https://github.com/archiforge/covid19-tracker"
               rel="noopener">GitHub</a>
            <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark theme"
                    title="Toggle light/dark theme">
                <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </nav>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="container site-footer__inner">
        <p>
            Data:
            <a href="https://github.com/CSSEGISandData/COVID-19" rel="noopener">COVID-19 Data Repository</a>
            by the Center for Systems Science and Engineering (CSSE) at Johns Hopkins University,
            licensed under <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a>.
        </p>
        <p>
            Built with Spring Boot.
            <a th:href="@{/api/summary}">JSON API</a> ·
            <a href="https://github.com/archiforge/covid19-tracker" rel="noopener">Source on GitHub</a>
        </p>
    </div>
</footer>

</body>
</html>
